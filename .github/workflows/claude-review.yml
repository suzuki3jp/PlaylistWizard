name: Claude Review PR
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: Review
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          allowed_bots: "renovate"
          track_progress: true
          prompt: |
            /review
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Prioritize reviewing serious issues that could cause bugs, security vulnerabilities, or performance problems. Focus on code quality, maintainability, and adherence to best practices.
            Provide detailed feedback using inline comments for specific issues, and add prefix 'CRITICAL, MAJOR, MINOR' to each comment based on severity.
            And always provide a summary of the review at the end, including an overall assessment and the pr status (approve, request changes, or comment).

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
