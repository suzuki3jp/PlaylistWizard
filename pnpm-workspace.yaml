packages:
  - "packages/*"
  - "apps/*"

# Dependency lifecycle scripts are disabled to prevent unreviewed package code
# from executing during installation.
allowBuilds:
  "@sentry/cli": false
  esbuild: false
  workerd: false

saveExact: true

overrides:
  "@opentelemetry/api": "1.9.1"

# Wait five days (5 * 24 * 60 minutes) before resolving newly published versions.
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  # Renovate security update: hono@4.12.34
  - hono@4.12.34
  # Renovate security update: next@16.3.8 || 16.4.1
  - next@16.3.8 || 16.4.1
  # Renovate security update: @sentry/nextjs@10.75.2
  - "@sentry/nextjs@10.75.2"
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
  # Renovate security update: better-auth@1.7.7
  - better-auth@1.7.7
